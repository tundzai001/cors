name: Dependency security and SonarCloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Audit ${{ matrix.component }} and transitive dependencies
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            manifest: cors_dashboard/backend/requirements.txt
          - component: agent
            manifest: geodetic/requirements.txt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install audit tool
        run: >-
          python -m pip install --only-binary :all: pip-audit==2.10.1
      - name: Resolve and audit the complete dependency graph
        env:
          PIP_ONLY_BINARY: ':all:'
        run: >-
          pip-audit --strict --progress-spinner off --requirement '${{ matrix.manifest }}'
      - name: Audit every declared pin including build tools
        run: pip-audit --strict --no-deps --disable-pip --progress-spinner off --requirement '${{ matrix.manifest }}'

  sonar:
    name: SonarCloud with full Python dependency resolution
    needs: dependencies
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.12'
      - name: Check SonarCloud token
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Add SONAR_TOKEN as a repository Actions secret, then rerun this job.'
            exit 1
          fi
      - name: Install PlatformIO
        run: |
          python -m venv /tmp/platformio
          /tmp/platformio/bin/pip install platformio==6.2.0
      - name: Build firmware and compilation database
        working-directory: geodetic/esp32
        run: |
          /tmp/platformio/bin/pio run -e tdm240x_dev_general
          /tmp/platformio/bin/pio run -e tdm240x_dev_general -t compiledb
      - name: Measure native firmware coverage
        working-directory: geodetic/esp32
        env:
          CXX: clang++-18
          LLVM_PROFDATA: llvm-profdata-18
          LLVM_COV: llvm-cov-18
          SONAR_PROJECT_ROOT: ${{ github.workspace }}
        run: python3 -B test/host/run_coverage.py
      - name: Scan source and resolved dependencies
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        with:
          args: >-
            -Dproject.settings=.sonarcloud.properties
            -Dsonar.sca.pythonBinary=${{ steps.python.outputs.python-path }}
