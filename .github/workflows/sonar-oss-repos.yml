name: Sonar OSS public repositories
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sonar-oss-repos.yml]
permissions:
  contents: read
jobs:
  scan:
    name: Sonar OSS - ${{ matrix.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        repository: [tundzai001, esp32-base-sonarfix, esp32-base, pi, tun, agent_connect, Learning-App, train-AI]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tundzai001/${{ matrix.repository }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set analysis scope for the checked out repository
        run: |
          echo 'sonar.sources=.' > "$RUNNER_TEMP/sonar-oss.properties"
          echo 'sonar.python.version=3.12' >> "$RUNNER_TEMP/sonar-oss.properties"
      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dproject.settings=${{ runner.temp }}/sonar-oss.properties
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=tundzai001-oss
            -Dsonar.projectKey=tundzai001-oss_${{ matrix.repository }}
            -Dsonar.projectName=${{ matrix.repository }}
            -Dsonar.links.scm=https://github.com/tundzai001/${{ matrix.repository }}
            -Dsonar.qualitygate.wait=true
