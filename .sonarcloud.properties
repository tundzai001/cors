# Keep the Python analysis range used by the existing Cloud scan.
sonar.python.version=3.10,3.11,3.12,3.13,3.14
sonar.tests=cors_dashboard/backend/tests,cors_dashboard/tests,geodetic/tests,geodetic/esp32/test,scripts
sonar.test.inclusions=cors_dashboard/backend/tests/**,cors_dashboard/tests/**,geodetic/tests/**,geodetic/esp32/test/**,scripts/*_selftest.js

# Upstream GIS data snapshots are repetitive INSERT data, not application code.
sonar.cpd.exclusions=cors_dashboard/backend/app/data/postgres_ImportData_vn_units.sql,cors_dashboard/backend/app/data/legacy_v2_4_1/ImportData_vn_units.sql
