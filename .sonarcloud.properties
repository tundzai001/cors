sonar.projectKey=tundzai001-oss_cors
sonar.organization=tundzai001-oss
sonar.host.url=https://sonarcloud.io
sonar.qualitygate.wait=true

# Match the backend/agent runtime used by the CI dependency resolver.
sonar.python.version=3.12
sonar.cfamily.reportingCppStandardOverride=c++17
sonar.cfamily.compile-commands=geodetic/esp32/compile_commands.json
sonar.coverageReportPaths=geodetic/esp32/cpp-coverage.xml

# Imported GIS data snapshots are not application source.
sonar.exclusions=cors_dashboard/backend/app/data/postgres_ImportData_vn_units.sql,cors_dashboard/backend/app/data/legacy_v2_4_1/ImportData_vn_units.sql,scripts/**/*_selftest.js
sonar.cpd.exclusions=cors_dashboard/backend/app/data/postgres_ImportData_vn_units.sql,cors_dashboard/backend/app/data/legacy_v2_4_1/ImportData_vn_units.sql

# These are PostgreSQL schema snapshots; the Oracle-only VARCHAR2 rule does not apply.
sonar.issue.ignore.multicriteria=postgresVarchar,legacyPostgresVarchar,arduinoJsonWorkflows,arduinoJsonStatus,arduinoJsonCore,arduinoJsonCommands,arduinoJsonGnss,arduinoJsonStartup,arduinoJsonStorage,arduinoJsonReadbackTests,arduinoJsonNtripCommon,arduinoJsonStorageStatus,documentedDeviceErrors,documentedStationErrors
sonar.issue.ignore.multicriteria.postgresVarchar.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.postgresVarchar.resourceKey=cors_dashboard/backend/app/data/postgres_CreateTables_vn_units.sql
sonar.issue.ignore.multicriteria.legacyPostgresVarchar.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.legacyPostgresVarchar.resourceKey=cors_dashboard/backend/app/data/legacy_v2_4_1/CreateTables_vn_units.sql

# PlatformIO pins ArduinoJson 6.21.5; these APIs are only deprecated in ArduinoJson 7.
sonar.issue.ignore.multicriteria.arduinoJsonWorkflows.ruleKey=cpp:S1874
sonar.issue.ignore.multicriteria.arduinoJsonWorkflows.resourceKey=geodetic/esp32/src/functions/backend/Backend_Agent_Workflows.cpp
sonar.issue.ignore.multicriteria.arduinoJsonStatus.ruleKey=cpp:S1874
sonar.issue.ignore.multicriteria.arduinoJsonStatus.resourceKey=geodetic/esp32/src/functions/backend/Backend_Agent_Status.cpp
sonar.issue.ignore.multicriteria.arduinoJsonCore.ruleKey=cpp:S1874
sonar.issue.ignore.multicriteria.arduinoJsonCore.resourceKey=geodetic/esp32/src/functions/backend/Backend_Agent.cpp
sonar.issue.ignore.multicriteria.arduinoJsonCommands.ruleKey=cpp:S1874
sonar.issue.ignore.multicriteria.arduinoJsonCommands.resourceKey=geodetic/esp32/src/functions/backend/Backend_Agent_Commands.cpp
sonar.issue.ignore.multicriteria.arduinoJsonGnss.ruleKey=cpp:S1874
sonar.issue.ignore.multicriteria.arduinoJsonGnss.resourceKey=geodetic/esp32/src/functions/backend/Backend_Agent_Gnss.cpp
sonar.issue.ignore.multicriteria.arduinoJsonStartup.ruleKey=cpp:S1874
sonar.issue.ignore.multicriteria.arduinoJsonStartup.resourceKey=geodetic/esp32/src/functions/backend/Backend_Agent_Startup.cpp
sonar.issue.ignore.multicriteria.arduinoJsonStorage.ruleKey=cpp:S1874
sonar.issue.ignore.multicriteria.arduinoJsonStorage.resourceKey=geodetic/esp32/src/functions/backend/Backend_Agent_Storage.cpp
sonar.issue.ignore.multicriteria.arduinoJsonReadbackTests.ruleKey=cpp:S1874
sonar.issue.ignore.multicriteria.arduinoJsonReadbackTests.resourceKey=geodetic/esp32/test/host/readback_checks.cpp
sonar.issue.ignore.multicriteria.arduinoJsonNtripCommon.ruleKey=cpp:S1874
sonar.issue.ignore.multicriteria.arduinoJsonNtripCommon.resourceKey=geodetic/esp32/src/functions/ntrip/ntrip_common.cpp
sonar.issue.ignore.multicriteria.arduinoJsonStorageStatus.ruleKey=cpp:S1874
sonar.issue.ignore.multicriteria.arduinoJsonStorageStatus.resourceKey=geodetic/esp32/src/functions/backend/Storage_Status.cpp

# These routes declare each raised status in FastAPI responses; S8415 still reports them.
sonar.issue.ignore.multicriteria.documentedDeviceErrors.ruleKey=python:S8415
sonar.issue.ignore.multicriteria.documentedDeviceErrors.resourceKey=cors_dashboard/backend/app/device_command_routes.py
sonar.issue.ignore.multicriteria.documentedStationErrors.ruleKey=python:S8415
sonar.issue.ignore.multicriteria.documentedStationErrors.resourceKey=cors_dashboard/backend/app/main.py
