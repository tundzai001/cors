    <script>
        // Instant Auth Check with Public Route Exceptions
        const publicRoutes = ['/', '/station/', '/network-status', '/coverage', '/blog', '/api/docs'];
        const currentPath = window.location.pathname;
        const isPublicRoute = publicRoutes.some(route =>
            route === '/' ? currentPath === '/' : currentPath.startsWith(route)
        );

        if (!isPublicRoute && !localStorage.getItem('access_token') && !sessionStorage.getItem('access_token')) {
            window.location.href = '/';
        }
    </script>

    <script>
        window.hideAppPreloader = function () {
            const loader = document.getElementById('app-preloader');
            if (!loader) return;
            loader.classList.add('app-preloader--hidden');
            window.setTimeout(() => loader.remove(), 450);
        };
        window.addEventListener('load', function () {
            window.setTimeout(function () {
                const loader = document.getElementById('app-preloader');
                if (loader) window.hideAppPreloader();
            }, 2500);
        });
    </script>
    <!-- Global Error Catcher & Reporter for Realtime Debugging -->
    <script>
        window.addEventListener('error', function (event) {
            // Avoid duplicating identical error messages
            const existing = document.querySelectorAll('.global-error-reporter');
            for (let el of existing) {
                if (el.textContent.includes(event.message)) return;
            }

            const errDiv = document.createElement('div');
            errDiv.className = 'global-error-reporter alert alert-danger animate__animated animate__fadeInDown';
            errDiv.style.position = 'fixed';
            errDiv.style.top = '10px';
            errDiv.style.left = '50%';
            errDiv.style.transform = 'translateX(-50%)';
            errDiv.style.zIndex = '99999';
            errDiv.style.width = '90%';
            errDiv.style.maxWidth = '800px';
            errDiv.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
            errDiv.style.border = '2px solid #dc3545';
            errDiv.innerHTML = `
                <div class="d-flex align-items-start gap-3">
                    <i class="bi bi-bug-fill fs-3 text-warning"></i>
                    <div class="flex-grow-1 pe-4">
                        <h6 class="alert-heading fw-bold mb-1">CẢNH BÁO: Lỗi hệ thống phát hiện (Uncaught Exception)</h6>
                        <p class="small mb-2">Đã xảy ra lỗi thực thi script trên trình duyệt của bạn. Hãy gửi ảnh chụp hoặc thông tin chi tiết bên dưới cho đội ngũ hỗ trợ:</p>
                        <pre class="global-error-reporter__body" style="white-space: pre-wrap; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 6px; color: #ffc107; font-family: monospace; font-size: 0.85rem; max-height: 250px; overflow-y: auto; margin-bottom: 0;"></pre>
                    </div>
                    <button type="button" class="btn-close" style="position:absolute;top:12px;right:12px" onclick="this.closest('.global-error-reporter').remove()" aria-label="Đóng thông báo"></button>
                </div>
            `;
            const body = errDiv.querySelector('.global-error-reporter__body');
            if (body) {
                body.textContent = `${event.message}\nat ${event.filename || 'unknown'}:${event.lineno || 0}:${event.colno || 0}\n\n${event.error ? event.error.stack : ''}`;
            }
            document.body.appendChild(errDiv);
            if (window.hideAppPreloader) window.hideAppPreloader();
        });

        window.addEventListener('unhandledrejection', function (event) {
            const existing = document.querySelectorAll('.global-error-reporter');
            const reasonStr = event.reason ? (event.reason.message || String(event.reason)) : 'No reason';
            for (let el of existing) {
                if (el.textContent.includes(reasonStr)) return;
            }

            const errDiv = document.createElement('div');
            errDiv.className = 'global-error-reporter alert alert-warning animate__animated animate__fadeInDown';
            errDiv.style.position = 'fixed';
            errDiv.style.top = '10px';
            errDiv.style.left = '50%';
            errDiv.style.transform = 'translateX(-50%)';
            errDiv.style.zIndex = '99999';
            errDiv.style.width = '90%';
            errDiv.style.maxWidth = '800px';
            errDiv.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
            errDiv.style.border = '2px solid #ffc107';
            errDiv.innerHTML = `
                <div class="d-flex align-items-start gap-3">
                    <i class="bi bi-exclamation-triangle-fill fs-3 text-dark"></i>
                    <div class="flex-grow-1 text-dark pe-4">
                        <h6 class="alert-heading fw-bold mb-1">CẢNH BÁO: Unhandled Rejection (Async Promise)</h6>
                        <pre class="global-error-reporter__body" style="white-space: pre-wrap; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 6px; color: #ffc107; font-family: monospace; font-size: 0.85rem; max-height: 250px; overflow-y: auto; margin-bottom: 0;"></pre>
                    </div>
                    <button type="button" class="btn-close" style="position:absolute;top:12px;right:12px" onclick="this.closest('.global-error-reporter').remove()" aria-label="Đóng thông báo"></button>
                </div>
            `;
            const body = errDiv.querySelector('.global-error-reporter__body');
            if (body) {
                body.textContent = event.reason ? (event.reason.stack || event.reason.message || String(event.reason)) : 'No reason provided';
            }
            document.body.appendChild(errDiv);
            if (window.hideAppPreloader) window.hideAppPreloader();
        });
    </script>
