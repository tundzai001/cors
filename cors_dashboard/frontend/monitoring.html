<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G5RWFTRMJG"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-G5RWFTRMJG');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor - CORS Control Center</title>
    
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- React Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            --gradient-danger: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --gradient-info: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
            --shadow-glow: 0 8px 32px rgba(103, 126, 234, 0.4);
        }

        body { 
            background: linear-gradient(135deg, #0a0e13 0%, #1a1d29 100%);
            color: #e9ecef;
            min-height: 100vh;
        }
        
        /* ==================== METRIC CARDS - REDESIGNED ==================== */
        .metric-card {
            background: linear-gradient(135deg, #1e2329 0%, #181c22 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            height: 100%;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: rgba(103, 126, 234, 0.3);
            box-shadow: var(--shadow-glow);
        }

        .metric-card:hover::before {
            opacity: 1;
        }

        .metric-icon {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 3rem;
            opacity: 0.08;
            transition: all 0.3s ease;
        }

        .metric-card:hover .metric-icon {
            opacity: 0.15;
            transform: scale(1.1) rotate(5deg);
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            margin-bottom: 8px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
        }

        .metric-label {
            color: #8b9bb4;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .metric-trend {
            position: absolute;
            bottom: 16px;
            left: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #51cf66;
            font-weight: 600;
        }

        /* Color Variants */
        .metric-card.cpu .metric-value { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .metric-card.cpu::before { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .metric-card.cpu .metric-icon { color: #667eea; }

        .metric-card.memory .metric-value { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .metric-card.memory::before { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
        .metric-card.memory .metric-icon { color: #84fab0; }

        .metric-card.disk .metric-value { background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .metric-card.disk::before { background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%); }
        .metric-card.disk .metric-icon { color: #ffd89b; }

        .metric-card.latency .metric-value { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .metric-card.latency::before { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }
        .metric-card.latency .metric-icon { color: #30cfd0; }

        /* ==================== CHART CONTAINERS ==================== */
        .card {
            background: linear-gradient(135deg, #1e2329 0%, #181c22 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
        }

        .card-header h6 {
            font-weight: 600;
            font-size: 0.95rem;
            color: #e9ecef;
            margin: 0;
        }

        /* ==================== TERMINAL LOG STYLE ==================== */
        #log-terminal {
            background: linear-gradient(135deg, #0a0e13 0%, #000000 100%);
            color: #00ff88;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            height: 500px;
            overflow-y: auto;
            border-radius: 0 0 16px 16px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-top: none;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
            padding: 16px;
        }

        .log-line {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding: 4px 0;
            transition: background 0.2s ease;
        }

        .log-line:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .log-error {
            color: #ff5555;
            font-weight: bold;
            background: rgba(255, 85, 85, 0.08);
            border-left: 3px solid #ff5555;
            padding-left: 8px;
        }

        .log-warning {
            color: #ffb86c;
            border-left: 3px solid #ffb86c;
            padding-left: 8px;
        }

        .log-info {
            color: #8be9fd;
        }

        .log-success {
            color: #50fa7b;
        }

        .log-timestamp {
            color: #6272a4;
            margin-right: 12px;
            user-select: none;
            font-weight: 600;
        }

        /* ==================== NAVBAR ==================== */
        .navbar {
            backdrop-filter: blur(20px);
            background: rgba(10, 14, 19, 0.95) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ==================== SCROLLBAR ==================== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(103, 126, 234, 0.4);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(103, 126, 234, 0.6);
        }

        /* ==================== ANIMATIONS ==================== */
        @keyframes slideInFromBottom {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .metric-card {
            animation: slideInFromBottom 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            animation-fill-mode: both;
        }

        .metric-card:nth-child(1) { animation-delay: 0.1s; }
        .metric-card:nth-child(2) { animation-delay: 0.2s; }
        .metric-card:nth-child(3) { animation-delay: 0.3s; }
        .metric-card:nth-child(4) { animation-delay: 0.4s; }

        .card {
            animation: slideInFromBottom 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            animation-delay: 0.5s;
            animation-fill-mode: both;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .metric-value {
                font-size: 2rem;
            }

            .metric-icon {
                font-size: 2.5rem;
            }

            #log-terminal {
                height: 400px;
                font-size: 12px;
            }
        }

        /* Tối ưu cho màn hình lớn */
        @media (min-width: 1400px) {
            .container-fluid {
                max-width: 1920px;
                margin: 0 auto;
            }
        }

        /* Đảm bảo không có khoảng trống thừa */
        main.container-fluid {
            padding-left: 2rem !important;
            padding-right: 2rem !important;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-light d-flex align-items-center gap-2" href="/">
                <i class="bi bi-activity" style="color: #667eea; font-size: 1.5rem;"></i>
                System Monitor
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="/" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-arrow-left me-1"></i> Dashboard
                </a>
                <span id="user-info" class="navbar-text d-none d-md-inline small text-muted"></span>
                <button id="logout-btn" class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container-fluid mt-4 pb-5 px-4">
        
        <!-- SECTION 1: SYSTEM RESOURCES -->
        <div class="row g-4 mb-4">
            <div class="col-lg-3 col-md-6">
                <div class="metric-card cpu">
                    <i class="bi bi-cpu metric-icon"></i>
                    <div class="metric-value" id="cpu-percent">0%</div>
                    <div class="metric-label">CPU Usage</div>
                    <div class="metric-trend">
                        <i class="bi bi-arrow-up-short"></i>
                        <span>Live</span>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="metric-card memory">
                    <i class="bi bi-memory metric-icon"></i>
                    <div class="metric-value" id="memory-percent">0%</div>
                    <div class="metric-label">RAM Usage</div>
                    <div class="metric-trend">
                        <i class="bi bi-arrow-up-short"></i>
                        <span>Live</span>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="metric-card disk">
                    <i class="bi bi-hdd metric-icon"></i>
                    <div class="metric-value" id="disk-percent">0%</div>
                    <div class="metric-label">Disk Usage</div>
                    <div class="metric-trend">
                        <i class="bi bi-arrow-up-short"></i>
                        <span>Stable</span>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="metric-card latency">
                    <i class="bi bi-activity metric-icon"></i>
                    <div class="metric-value" id="avg-response-time">0ms</div>
                    <div class="metric-label">Avg Latency</div>
                    <div class="metric-trend">
                        <i class="bi bi-arrow-down-short"></i>
                        <span>Optimal</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION 2: CHARTS & HEATMAP -->
        <div class="row g-4 mb-4">
            <div class="col-xxl-9 col-xl-8 col-lg-7">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">
                            <i class="bi bi-graph-up me-2" style="color: #667eea;"></i>
                            System Load & Response Time
                        </h6>
                        <div class="badge bg-dark border border-secondary">
                            <i class="bi bi-clock me-1"></i>Real-time (Last 60s)
                        </div>
                    </div>
                    <div class="card-body">
                        <div style="height: 300px; position: relative;">
                            <canvas id="systemChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xxl-3 col-xl-4 col-lg-5">
                <div id="heatmap-root" class="h-100"></div>
            </div>
        </div>

        <!-- SECTION 3: LOGS & FEED -->
        <div class="row g-4">
            <div class="col-xxl-9 col-xl-8 col-lg-7">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-3">
                            <h6 class="mb-0">
                                <i class="bi bi-terminal me-2 text-danger"></i>
                                Backend Error Logs
                            </h6>
                            <span class="badge bg-dark border border-secondary">app.log</span>
                        </div>
                        <div class="d-flex gap-2">
                            <select id="log-level" class="form-select form-select-sm bg-dark text-light border-secondary" style="width: auto;">
                                <option value="ALL">All Levels</option>
                                <option value="ERROR" selected>ERROR Only</option>
                                <option value="WARNING">WARNING</option>
                                <option value="INFO">INFO</option>
                            </select>
                            <button class="btn btn-sm btn-outline-light" onclick="fetchLogs()">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="document.getElementById('log-terminal').innerHTML = ''">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div id="log-terminal">
                        <div class="text-center text-muted mt-5">
                            <span class="spinner-border spinner-border-sm me-2"></span>
                            Waiting for logs...
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xxl-3 col-xl-4 col-lg-5">
                <div id="activity-feed-root" class="h-100"></div>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script type="text/babel" src="/js/advanced-features.js?v=20260507"></script>
    <script type="text/babel">
        document.addEventListener('DOMContentLoaded', () => {
            const heatmapContainer = document.getElementById('heatmap-root');
            if (heatmapContainer && window.ActivityHeatmap) {
                const root = ReactDOM.createRoot(heatmapContainer);
                root.render(React.createElement(window.ActivityHeatmap, { 
                    title: "Activity Heatmap" 
                }));
            }
            
            const feedContainer = document.getElementById('activity-feed-root');
            if (feedContainer && window.ActivityFeed) {
                const root = ReactDOM.createRoot(feedContainer);
                root.render(React.createElement(window.ActivityFeed, { maxItems: 30 }));
            }
        });
    </script>

    <script src="/js/monitoring-dashboard.js?v=20260507"></script>

    <script>
        // Auth Check
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/login.html';
        }

        // User Info
        async function loadUser() {
            try {
                const res = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 401) {
                    localStorage.removeItem('access_token');
                    window.location.href = '/login.html';
                    return;
                }
                
                if(res.ok) {
                    const user = await res.json();
                    document.getElementById('user-info').textContent = `${user.username} (${user.role})`;
                }
            } catch(e) { 
                console.error(e); 
            }
        }
        loadUser();

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            window.location.href = '/login.html';
        });

        // Terminal Log Viewer
        const logTerminal = document.getElementById('log-terminal');
        const logLevelSelect = document.getElementById('log-level');

        async function fetchLogs() {
            const level = logLevelSelect.value;
            
            try {
                const res = await fetch(`/api/admin/server-logs?lines=200&level=${level}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    localStorage.removeItem('access_token');
                    window.location.href = '/login.html';
                    return;
                }

                if (!res.ok) {
                    if (res.status === 403) throw new Error("Admin access required");
                    throw new Error("Failed to fetch logs");
                }

                const data = await res.json();
                renderLogs(data.logs);

            } catch (e) {
                logTerminal.innerHTML = `<div class="text-danger p-3">Error: ${e.message}</div>`;
            }
        }

        function renderLogs(lines) {
            if (!lines || lines.length === 0) {
                logTerminal.innerHTML = '<div class="text-muted text-center pt-5">No logs found.</div>';
                return;
            }

            const html = lines.map(line => {
                let cssClass = "";
                let icon = "";

                if (line.includes("ERROR") || line.includes("CRITICAL")) {
                    cssClass = "log-error";
                    icon = "❌ ";
                } else if (line.includes("WARNING")) {
                    cssClass = "log-warning";
                    icon = "⚠️ ";
                } else if (line.includes("INFO")) {
                    cssClass = "log-info";
                    icon = "ℹ️ ";
                } else if (line.includes("success")) {
                    cssClass = "log-success";
                    icon = "✅ ";
                }

                const escaped = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<div class="log-line ${cssClass}">${icon}${escaped}</div>`;
            }).join('');

            logTerminal.innerHTML = html;
            logTerminal.scrollTop = logTerminal.scrollHeight;
        }

        fetchLogs();
        setInterval(fetchLogs, 10000);
        logLevelSelect.addEventListener('change', fetchLogs);
    </script>
</body>
</html>
