worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # BEGIN BASE SECURITY GEO
    geo $cors_blocked_ip {
        default 0;
        include "C:/nginx-1.28.0/conf/cors-blocked-ips.conf";
    }
    # END BASE SECURITY GEO

    include       mime.types;
    default_type  application/octet-stream;

    # --- LOGGING ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_host"';

    access_log logs/access.log main;
    error_log logs/error.log warn;

    # --- TỐI ƯU KẾT NỐI ---
    sendfile        on;
    keepalive_timeout  65;

    # Timeout dài cho WebSocket và kết nối chậm
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 75s;

    # --- HỖ TRỢ WEBSOCKET ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $arg_v $versioned_asset_cache_control {
        ""      "no-cache";
        default "public, max-age=31536000, immutable";
    }

    # =====================================================================
    # WEB 1: AITOGY.COM (IIS - PORT 8081)
    # =====================================================================

    server {
        listen 80;
        server_name aitogy.com www.aitogy.com;

        location /.well-known/acme-challenge/ {
            root C:/nginx-1.28.0/html;
        }

        location / {
            return 301 https://aitogy.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name aitogy.com www.aitogy.com;

        ssl_certificate      C:/Certbot/live/aitogy.com/fullchain.pem;
        ssl_certificate_key  C:/Certbot/live/aitogy.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

        access_log off;
        error_log logs/aitogy.com-error.log error;

        location ~ /\.(env|git|svn|htaccess) { deny all; return 444; }

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";

            proxy_redirect http:// https://;
            proxy_redirect ~^http://([^:]+)(:\d+)?/(.*)$ https://$1/$3;
            add_header Content-Security-Policy "upgrade-insecure-requests" always;

            sub_filter_types text/css text/javascript application/javascript;
            sub_filter 'http://aitogy.com' 'https://aitogy.com';
            sub_filter_once off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
        }
    }

    # =====================================================================
    # WEB 2: BASE.AITOGY.COM (PYTHON - PORT 8000)
    # =====================================================================

    server {
        listen 80;
        server_name base.aitogy.com;
        # BASE SECURITY DROP
        if ($cors_blocked_ip) { return 444; }

        location /.well-known/acme-challenge/ {
            root C:/nginx-1.28.0/html;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
	http2 on;
        server_name base.aitogy.com;
        # BASE SECURITY DROP
        if ($cors_blocked_ip) { return 444; }

        # Certificate for base.aitogy.com.
        ssl_certificate      C:/Certbot/live/base.aitogy.com/fullchain.pem;
        ssl_certificate_key  C:/Certbot/live/base.aitogy.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:CorsTLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

        access_log off;
        error_log logs/base.aitogy.com-error.log error;

        location ~ /\.(env|git|svn|htaccess) {
            deny all;
            return 444;
        }

        # JS/CSS có ?v=... được cache immutable; file chưa version hóa luôn revalidate.
        location ~* ^/assets/.*\.(?:css|js)$ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_cache off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control $versioned_asset_cache_control always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Media/font ít thay đổi, cache 30 ngày nhưng không immutable.
        location ~* ^/(?:css|js|img)/ {
            return 404;
        }

        location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|woff2|woff|ttf)$ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_cache off;
            expires 30d;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /favicon.ico {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /robots.txt {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /sitemap.xml {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_cache off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Canonical URL: index.html -> /, mọi *.html khác -> URL không đuôi.
        location = /index.html {
            return 301 /$is_args$args;
        }

        location = /index.htm {
            return 301 /$is_args$args;
        }

        location ~* ^/(.+)\.html?$ {
            return 301 /$1$is_args$args;
        }

        # Backend đã cung cấp route sạch; không rewrite ngược lại .html.
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_cache off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Content-Security-Policy "upgrade-insecure-requests" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

