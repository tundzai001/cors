; Open the CORS folder directly in VS Code; firmware stays in geodetic/esp32.
; Board environments and dependencies are defined only in the firmware config.
[platformio]
default_envs = tdm240x_dev_general
extra_configs = geodetic/esp32/platformio.ini
src_dir = geodetic/esp32/src
include_dir = geodetic/esp32/include
test_dir = geodetic/esp32/test
boards_dir = geodetic/esp32/boards
workspace_dir = geodetic/esp32/.pio

; The upstream config is kept unchanged; root builds resolve its partition table here.
[env:tdm240x_dev_general]
board_build.partitions = geodetic/esp32/partitions.csv

[env:tdm240x_dev_general_debug]
board_build.partitions = geodetic/esp32/partitions.csv

[env:tdm240x_dev_general_test]
board_build.partitions = geodetic/esp32/partitions.csv

[env:tdm240x_dev_unit_test]
board_build.partitions = geodetic/esp32/partitions.csv
